<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>NETRIKA | Password recovery</title>
    <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
    <main class="dashboard-card recovery-card">
        <p class="dashboard-label">NETRIKA</p>
        <h1 id="title">Forgot password?</h1>
        <p id="instructions">Enter your registered email to receive a password reset link.</p>
        <form id="recoveryForm">
            <label id="emailLabel">Email <input type="email" name="email" autocomplete="email" required></label>
            <label id="passwordLabel" hidden>New password <input type="password" name="password" minlength="8" maxlength="256" autocomplete="new-password"></label>
            <label id="confirmLabel" hidden>Confirm password <input type="password" name="confirm" autocomplete="new-password"></label>
            <button class="primary-action" type="submit" id="submit">Send reset link</button>
        </form>
        <p id="status" role="status"></p>
        <a href="/#login">Back to login</a>
    </main>
    <script>
        const params = new URLSearchParams(location.hash.slice(1));
        const token = params.get('token');
        const role = params.get('role') || new URLSearchParams(location.search).get('role') || 'student';
        if (token) history.replaceState(null, '', location.pathname);
        const form = document.getElementById('recoveryForm');
        const status = document.getElementById('status');
        const button = document.getElementById('submit');
        if (token) {
            document.getElementById('title').textContent = 'Reset password';
            document.getElementById('instructions').textContent = 'Choose a new password with at least eight characters.';
            document.getElementById('emailLabel').hidden = true;
            form.elements.email.required = false;
            document.getElementById('passwordLabel').hidden = false;
            document.getElementById('confirmLabel').hidden = false;
            form.elements.password.required = true;
            form.elements.confirm.required = true;
            button.textContent = 'Save new password';
        }
        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            if (token && form.elements.password.value !== form.elements.confirm.value) {
                status.textContent = 'Passwords do not match.';
                return;
            }
            button.disabled = true;
            status.textContent = 'Please wait…';
            try {
                const body = token ? {token, role, password: form.elements.password.value} : {role, email: form.elements.email.value};
                const response = await fetch(token ? '/api/reset-password' : '/api/forgot-password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
                const data = await response.json();
                status.textContent = data.message || 'Please check your input.';
                if (response.ok && token) form.hidden = true;
            } catch (error) {
                status.textContent = 'Could not connect. Please try again.';
            } finally { button.disabled = false; }
        });
    </script>
</body>
</html>
