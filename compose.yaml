services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TEACHER_USERNAME: ${TEACHER_USERNAME:?Set TEACHER_USERNAME in .env}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?Set TEACHER_PASSWORD in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FASTAPI_RELOAD: "false"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  mongo_data:
